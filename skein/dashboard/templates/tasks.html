{% extends "base.html" %}
{% block title %}Tasks{% endblock %}
{% block content %}
<h1>Tasks</h1>
<form method="get" class="filters">
  <label>Search: <input type="search" name="q" value="{{ current_q or '' }}" placeholder="task id, context, error, payload..."></label>
  <label>State:
    <select name="state">
      <option value="">All</option>
      {% for s in states %}
      <option value="{{ s }}" {% if s == current_state %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Agent: <input type="text" name="agent" value="{{ current_agent or '' }}" placeholder="agent id"></label>
  <button type="submit">Filter</button>
  {% if current_state or current_agent or current_q %}
  <a href="{{ url_for('dashboard.tasks') }}" class="clear">Clear</a>
  {% endif %}
</form>

<div id="tasks-table"
     hx-get="{{ url_for('dashboard.tasks', state=current_state, agent=current_agent, q=current_q) }}"
     hx-trigger="every 5s"
     hx-swap="innerHTML">
  {% include "_tasks_table.html" %}
</div>
{% endblock %}
