[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skein"
version = "0.1.0"
description = "Local-first observability for A2A multi-agent message flows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonny Armstrong", email = "jarmstrong158@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "apscheduler>=3.10",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/jarmstrong158/skein"
Repository = "https://github.com/jarmstrong158/skein"

[tool.setuptools.packages.find]
include = ["skein*", "skein_mcp*"]

[tool.setuptools.package-data]
skein = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
