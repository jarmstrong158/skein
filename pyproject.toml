[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skein"
version = "0.1.0"
description = "Local-first observability for A2A multi-agent message flows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonny Armstrong", email = "jarmstrong158@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "apscheduler>=3.10",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mcp>=2.0,<3",
    "ruff>=0.5",
    "mypy>=1.10",
]
mcp = [
    "mcp>=2.0,<3",
]

[project.scripts]
skein = "skein.cli:main"
skein-mcp = "skein_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jarmstrong158/skein"
Repository = "https://github.com/jarmstrong158/skein"

[tool.setuptools.packages.find]
include = ["skein*", "skein_mcp*"]

[tool.setuptools.package-data]
skein = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by formatter; long SQL strings tolerated

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"packaging/windows/*.spec" = ["F821"]  # PyInstaller injects globals

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = "(packaging/|build/|dist/|tests/)"
